workflows:
  ios-release:
    name: Decide AI iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - app-secrets
    scripts:
      - name: Create Flutter runtime env
        script: |
          chmod +x ./scripts/create_flutter_env.sh
          ./scripts/create_flutter_env.sh
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Build iOS archive
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/*.app
