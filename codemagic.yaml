workflows:
  ios-release:
    name: Decide AI iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - app-secrets
    scripts:
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Build iOS archive
        script: |
          flutter build ipa --release --no-codesign \
            --dart-define=AI_PROVIDER="${AI_PROVIDER:-firebase}" \
            --dart-define=FIREBASE_FUNCTIONS_URL="${FIREBASE_FUNCTIONS_URL:-https://us-central1-decide-ai-89445.cloudfunctions.net/generateDecision}" \
            --dart-define=FIREBASE_IMAGE_FUNCTIONS_URL="${FIREBASE_IMAGE_FUNCTIONS_URL:-https://us-central1-decide-ai-89445.cloudfunctions.net/generateGlowUpImage}"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/*.app
