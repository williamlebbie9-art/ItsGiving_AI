# --- decide.ai Gradle tuning for a 4-core / 8 GB RAM build host ---
# The previous -Xmx8G / MaxMetaspaceSize=4G settings caused native Out-Of-Memory
# crashes. Keep the heap modest (1.5G) to avoid OS thrashing, but leave the
# daemon ON: without it every build cold-starts a fresh JVM and redoes all
# configuration, which dominated build time on this host.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.daemon.idletimeout=600000
org.gradle.vfs.watch=true
kotlin.daemon.jvmargs=-Xmx768m
# Fail fast on stalled downloads so Gradle retries instead of hanging for 10
# minutes per artifact (socket timeout = inactivity between packets, not total).
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.http.maxRetries=5
# NOTE: configuration-cache is intentionally OFF - Flutter's DependencyVersionChecker
# (DebugMinSdkCheck) cannot serialize into the configuration cache and the build
# fails with "Plugin KotlinBaseApiPlugin has not been used".
# org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
